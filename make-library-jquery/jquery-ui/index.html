<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jQuery UI Autocomplete - Default functionality</title>
  <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
  <link rel="stylesheet" href="/resources/demos/style.css">
  <script src="https://code.jquery.com/jquery-1.12.4.js"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
  <style>
        .ui-widget{
            display: block;
            text-align: center;
            margin: 10vh;
            background-color: greenyellow;
            padding: 30px;
            border-radius: 30px;
            box-shadow: 25px 40px 5px green;
        }
        label{
            font-weight: 600;
            border-radius: 5px;
            color: green;
            margin-right: 30px;
            box-shadow: 10px 14px 10px;
        }
        #tags {
            width: 300px;
            padding: 12px;
            border: 2px solid green;
            border-radius: 10px;
            background-color: lightyellow;
            box-shadow: 20px 20px 10px green;
        }


  </style>
  <script>
  $( function() {
    var availableTags = [
      "ActionScript",
      "AppleScript",
      "Asp",
      "BASIC",
      "C",
      "C++",
      "Clojure",
      "COBOL",
      "ColdFusion",
      "Erlang",
      "Fortran",
      "Groovy",
      "Haskell",
      "Java",
      "jawa",
      "JavaScript",
      "Lisp",
      "Perl",
      "Peri",
      "PHP",
      "Python",
      "Ruby",
      "Scala",
      "Scheme"
    ];
    $( "#tags" ).autocomplete({
      source: availableTags
    });
  } );
  </script>
</head>
<body>
<div class="ui-widget">
  <label for="tags">Tags: </label>
  <input id="tags">
</div>
</body>
</html>
