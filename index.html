<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .liba {
            background-color: blue;
            height: 20vh;
            width: 40vh;
            margin: 10vh auto;
            display: flex;
            padding: 10px;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            box-shadow: -40px 60px 40px;
        }

        .keLiba,
        .hapusLiba {
            text-align: center;
            font-size: small;
            background-color: turquoise;
            margin: 5px;
            width: 100px;
            height: 50px;
            border-radius: 10px;
            box-shadow: 10px 10px 4px;
        }
    </style>
</head>

<body>
    <h1>Where you wanna go?</h1>
    <ul class="lokasi">
        <li class="parepare">Parepare</li>
        <li class="ambasing">Ambasing</li>
        <li>Makassar</li>
        <li id="ngawi">Ngawii</li>
        <li class="medan">Medan</li>
    </ul>
    <h4>Kecamatan</h4>
    <ol id="Kecamatan">
        <li class="curio">Curio</li>
        <li>Ujung</li>
        <li>Ujung Pandang</li>
    </ol>

    <div class="liba">
        <button class="keLiba">Liba</button>
        <button class="hapusLiba">Hapus</button>
    </div>


    <input type="text" class="inputan" value="Puqi ngana">

    <script src="node_modules/jquery/dist/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            // console.log('Jquery sudah jalan');
            // $(`li`).text(`puqi kalian`); //target semua li
            // $(`.parepare`).text(`munafik`); // target class
            // $(`#ngawi`).text(`ambatukam`); // target id

            var jogja = $('<li>Yogyakarta</li>');
            $('.lokasi').prepend(jogja);
            var amerika = $('<li>Amerika</li>');
            $('.lokasi').append(amerika);

            var liba = $('<li>Liba</li>');
            $('#Kecamatan').prepend(liba);


            $('.ambasing').text('Apasihh');
            $('.medan').html('<em>Medan gotham city</em>');
            $('.inputan').val('ga boleh bacara kasar');


            $('.parepare').remove();


            console.log($('.medan').text());
            console.log($('.medan').html());
            console.log($('.inputan').val());


            $('.keLiba').on('click', function () {
                alert('Dusun Liba, solid solid solid');
            });
            $('.hapusLiba').on('click', function () {
                $('.curio').remove();
                alert('Curio dihapus :(');
            });

        });
    </script>
</body>

</html>
